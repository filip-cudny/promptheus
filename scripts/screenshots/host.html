<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Animation host</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: var(--font-sans);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      #caption {
        position: absolute;
        left: 40px;
        bottom: 22px;
        padding: 6px 16px;
        border-radius: 10px;
        background: rgba(24, 24, 27, 0.92);
        color: #fff;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="caption" hidden></div>
    <script type="module" src="/scripts/screenshots/host.ts"></script>
  </body>
</html>
